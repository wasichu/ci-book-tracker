name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Keep checking for advisories and regressions even when the repo is idle.
    - cron: "23 15 * * 1"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-beam-${{ hashFiles('.tool-versions', 'mix.lock') }}
      - run: mix deps.get --check-locked
      - run: mix ci

  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict
      # Jobs have isolated workspaces. Fetch the locked dependencies before Mix
      # loads the project's configured listeners and runs the audit.
      - run: mix deps.get --check-locked
      - run: mix hex.audit
